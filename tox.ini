[tox]
envlist = py38, py39, py310, py311, py312, lint
isolated_build = True

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310, lint
    3.11: py311
    3.12: py312

[testenv]
deps =
    pytest>=7.0.0,<8.0.0
    pytest-cov>=3.0.0,<4.0.0
    # Add other test-specific dependencies here
commands =
    pytest {posargs}

[testenv:lint]
deps =
    pre-commit>=2.20.0,<4.0.0
    # Add any other linters or formatters you want to run via tox
    # For example, if you want to run ruff directly:
    # ruff
commands =
    pre-commit run --all-files
    # Or, to run specific tools:
    # black --check .
    # ruff check .
    # docformatter --check --recursive .

# You can also add environments for building docs, etc.
# [testenv:docs]
# deps = sphinx
# commands = sphinx-build docs docs/_build
