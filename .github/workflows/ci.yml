name: Python Package CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
        # Install pre-commit to ensure linting tools are available if not managed by tox
        pip install pre-commit 

    - name: Lint with pre-commit
      run: |
        pre-commit run --all-files
        # Alternatively, if your tox 'lint' env handles all linting:
        # tox -e lint

    - name: Test with tox
      run: |
        tox -e py # This will run the default python test environments matching the current python version
        # If you want to run a specific tox environment based on matrix.python-version:
        # tox -e py${{ matrix.python-version }} # Ensure your tox.ini env names match this pattern

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.10' # Or your primary testing version
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }} # Optional: if you use Codecov
        # files: ./coverage.xml # Adjust if your coverage report is named differently or in a different location
        # flags: unittests # Optional
        # name: codecov-umbrella # Optional
        # fail_ci_if_error: true # Optional
        # verbose: true # Optional
